databaseChangeLog:
  - changeSet:
      id: 1
      author: Siarhei Shveadko
      changes:
        - dropColumn:
            tableName: document_type
            columnName: llm_extraction_params
      rollback:
        - addColumn:
            tableName: document_type
            columns:
              - column:
                  name: llm_extraction_params
                  type: JSONB
                  constraints:
                    nullable: true
  - changeSet:
      id: 2
      author: Siarhei Shveadko
      changes:
        - sql:
            sql: |
              UPDATE document_type
              SET extractors = (
                SELECT jsonb_agg(
                  jsonb_strip_nulls(
                    elem - 'prompts'
                  )
                )
                FROM jsonb_array_elements(extractors::jsonb) AS elem
              )
              WHERE extractors != '[]'::jsonb;
      rollback:
        - sql:
            sql: |
              UPDATE document_type
              SET extractors = (
                SELECT jsonb_agg(
                  jsonb_set(
                    elem,
                    '{prompts}',
                    '[]'::jsonb,
                    true
                  )
                )
                FROM jsonb_array_elements(extractors::jsonb) AS elem
              )
              WHERE extractors != '[]'::jsonb;

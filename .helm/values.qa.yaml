extraction:
  image:
    path: "/deps-platform/deps-extraction"
  resources: {}
#    limits:
#      cpu:
#      memory:
#    requests:
#      cpu:
#      memory:


extraction_settings:
  ENV: qa

  EXTERNAL_URL: "https://qa-host"

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  # Telemetry
  INSTRUMENTATION_ENABLED: true

extraction_consumer:
  image:
    path: "/deps-platform/deps-extraction"

migrator:
  image:
    path: "/deps-platform/deps-extraction-migrator"

migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

helm:
  enabled: false

csi:
  vault_namespace: 'k8s-qa'
  roleName: 'k8s-qa'
  vaultKubernetesMountPath: 'kubernetes-qa'

service_account:
  serviceAccountName: 'deps-qa'

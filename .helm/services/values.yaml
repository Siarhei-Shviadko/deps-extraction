        key: extraction-db-user
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: deps-extraction
        key: extraction-db-password
  - name: AUTH_CERTS_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: deps-extraction
        key: keycloak-certs-endpoint
  - name: AUTH_ENABLED
    valueFrom:
      secretKeyRef:
        name: deps-extraction
        key: auth-enabled
  - name: MESSAGING_DRIVER

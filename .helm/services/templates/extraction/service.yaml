apiVersion: v1
kind: Service
metadata:
  name: extraction
  labels:
    {{- include "deps-extraction.labels" . | nindent 4 }}
spec:
  type: {{ .Values.extraction.service.type }}
  ports:
    - port: {{ .Values.extraction.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-extraction.selectorLabels" . | nindent 4 }}

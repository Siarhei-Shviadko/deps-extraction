[tool.poetry]
name = "extraction"
version = "0.1.0"
description = "Extraction service stores extracted-data and sends documents to the appropriate extraction plugin."
authors = []

[tool.poetry.dependencies]
python = "~3.12"
dependency-injector = "^4.48.0"
pydantic = "^2.12.0"
pydantic-settings = "^2.11.0"
click = "^8.1.3"
psycopg2-binary = "^2.9.5"
uvicorn = "^0.18.3"
fastapi = "^0.120"
SQLAlchemy = "^2.0"
httpx = "^0.27.0"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-extracted-data = { path = "../vendors/deps-extracted-data", develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
bandit = "^1.7.5"
flake8 = "^6.1.0"
wemake-python-styleguide = "^0.18"
flake8-commas-x = "^3.0.0"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
requests-mock = "~1.9.3"
types-requests = "^2.25.6"

ipdb = "^0.13.9"
see = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
datasource = ["datasource"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
)
'''

[tool.pytest.ini_options]
markers = [
    "document_type",
]

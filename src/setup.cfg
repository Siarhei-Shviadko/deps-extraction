[tool:pytest]
cache_dir = /tmp/test_cache/.pytest_cache

[flake8]
ignore =
    # Missing docstring in public module
    D100,
    # Missing docstring in public class
    D101,
    # Missing docstring in public function
    D103,
    # Missing docstring in public package
    D104,
    # Do not perform function calls in argument defaults.  The call is performed only once at function definition time.
    B008,
    # Class without a base class
    WPS306,
    # Found a line that starts with a dot
    WPS348,
    # Found too short name
    WPS111,
    # Missing docstring in __init__
    D107,
    # Missing docstring in public method
    D102,
    # Missing parameter(s) in Docstring
    DAR101,
    # Missing "Returns" in Docstring
    DAR201,
    # Found commented out code
    E800,
    # Found `f` string
    WPS305,
    # Line break before binary operator
    W503,
    # Found upper-case constant in a class
    WPS115,
    # Found subclassing a builtin
    WPS600,
    # Double quotes found but single quotes preferred
    Q000,
    # Found module with too many imports
    WPS201,
    # Found too many arguments
    WPS211,
    # Found local folder import
    WPS300,
    # Found complex default value
    WPS404,
    # Found too long ``try`` body length
    WPS229,
    # Found `__init__.py` module with logic
    WPS412,
    # Found wrong keyword: pass
    WPS420,
    # Found nested class:
    WPS431,
    # Found wrong variable name
    WPS110,
    # Missing docstring in public nested class
    D106,
    # Found string constant over-use
    WPS226,
    # Found a too complex `f` string
    WPS237,
    # Found line with high Jones Complexity: 16 > 14
    WPS221,
    # Found wrong function call
    WPS421,
    # Remove all docstring rules
    D,
    # Found shadowed class attribute
    WPS601,
    # Found using `@staticmethod`
    WPS602,
    # Found incorrect node inside `class` body
    WPS604,
    # Found walrus operator
    WPS332,
    # Found string formatting
    WPS323,
    # Found wrong metadata variable: __all__
    WPS410,
    # Found implicit string concatenation
    WPS326,
    # Found incorrect order of methods in a class
    WPS338,
    # Found too many methods
    WPS214,
    # Found direct magic attribute usage: __dict__
    WPS609,
    F403,
    # Found vague import that may cause confusion: *
    WPS347,
    F405,
    WPS231,
    WPS437,
    WPS222,
    WPS215,
    # Found too many imported names from a module
    WPS235,
    # Unpythonic getter or setter
    WPS615,
    # Found overused expression
    WPS204,
    # Found too many public instance attributes
    WPS230,
    # Found multiline conditions
    WPS337,
    # Found inconsistent `return` statement
    WPS324,
    N818,
    WPS467,
    WPS473,
    E202,
    E251,
    E721,

exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv,
    __init__.py,

per-file-ignores =
    # There are multiple `assert`s in tests, we allow them:
    src/tests/*.py: S101
    ./deps_extraction/entrypoint.py: WPS421, WPS433, WPS430, WPS212
    ./deps_extraction/containers.py: WPS202, WPS203
    ./deps_extraction/infrastructure/repositories/extracted_data/mappers.py: WPS235
    ./deps_extraction/infrastructure/repositories/extracted_data/mappers/bbox_coordinates_mappers.py: WPS234, WPS118
    ./deps_extraction/infrastructure/repositories/extracted_data/mappers/table_mappers.py: WPS337
    ./deps_extraction/infrastructure/repositories/extracted_data/mappers/extracted_data_mapper.py: WPS2
    ./deps_extraction/infrastructure/repositories/extracted_data/mappers/field_data_mapper.py: WPS2
    ./deps_extraction/application.py: WPS214
    ./deps_extraction/infrastructure/repositories/extracted_data/mappers/chunked_mapper.py: WPS219, WPS214
    # WPS432 Found magic number: 250
    ./deps_extraction/domain/model/*.py: WPS432
    ./deps_extraction/infrastructure/repositories/extracted_data/mappers/utils.py: WPS100
    ./deps_extraction/extras/*: S105, WPS112, WPS516, WPS503, WPS430, B019, WPS331, P101, WPS331, WPS608, S113, WPS232, WPS220, WPS433, WPS425, N805
    ./deps_extraction/messaging/utils.py: WPS100
    ./deps_extraction/domain/model/document_type/llm_extraction_params/llm_extraction_params.py: E501, WPS358


max-local-variables = 15
max-methods = 15
max-line-length = 120
max-module-members = 15

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined
warn_no_return = False

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /app/.venv/*
    /vendors/*
branch = True
data_file = /tmp/test_cache/.coverage

[ipdb]
context = 21
